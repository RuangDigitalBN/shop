<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Items Shop</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--line:#2a2f3d;--text:#e8eaf0;--mute:#9097a8;--accent:#7c5cff;--green:#25d366}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{margin:0;font-size:1.2rem}
header p{margin:2px 0 0;color:var(--mute);font-size:.85rem}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;color:#fff;background:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.wa{background:var(--green);color:#052b12;font-weight:600}
.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
main{max-width:1000px;margin:0 auto;padding:20px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font:inherit}
input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:16/10;background:linear-gradient(135deg,#2b2350,#16202e);display:flex;align-items:center;justify-content:center;font-size:2rem}
.img img{width:100%;height:100%;object-fit:cover}
.body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.game{color:var(--mute);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
.name{font-weight:600}
.desc{color:var(--mute);font-size:.85rem;flex:1}
.price{font-weight:700}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;z-index:10}
#drawer.open{transform:none}
#drawer .top{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
#lines{flex:1;overflow:auto;padding:12px 16px}
.line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.qty{display:flex;align-items:center;gap:6px}
.qty button{padding:2px 9px}
#foot{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.total{display:flex;justify-content:space-between;font-weight:700}
.empty{color:var(--mute);text-align:center;padding:40px 0}
</style>
</head>
<body>
<header>
  <div><h1 id="store">Shop</h1><p id="tag"></p></div>
  <button id="cartBtn">Cart (0)</button>
</header>
<main>
  <div class="tools">
    <input id="q" placeholder="Search items...">
    <select id="gameFilter"><option value="">All games</option></select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<aside id="drawer">
  <div class="top"><strong>Your cart</strong><button class="ghost" id="close">Close</button></div>
  <div id="lines"></div>
  <div id="foot">
    <input id="gameId" placeholder="Your game ID / username (optional)">
    <div class="total"><span>Total</span><span id="total"></span></div>
    <button class="wa" id="waBtn">Order via WhatsApp</button>
    <button id="payBtn">Pay online</button>
  </div>
</aside>
<script>
let cfg = {}, items = [], cart = {};
try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch (e) {}
const $ = id => document.getElementById(id);
const money = n => cfg.currency + Number(n).toFixed(2);
const save = () => { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch (e) {} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch("products.json?" + Date.now()).then(r => r.json()).then(d => {
  cfg = d.config; items = d.items;
  $("store").textContent = cfg.storeName; document.title = cfg.storeName;
  $("tag").textContent = cfg.tagline || "";
  const games = [...new Set(items.map(i => i.game).filter(Boolean))];
  $("gameFilter").innerHTML += games.map(g => `<option>${esc(g)}</option>`).join("");
  if (!(cfg.payment && cfg.payment.enabled)) $("payBtn").style.display = "none";
  else $("payBtn").textContent = cfg.payment.label || "Pay online";
  // drop cart entries for items that were removed from the catalogue
  Object.keys(cart).forEach(id => { if (!items.find(i => i.id === id && !i.soldOut)) delete cart[id]; });
  render(); drawCart();
}).catch(() => { $("grid").innerHTML = '<p class="empty">Could not load products.json</p>'; });

function render() {
  const q = $("q").value.toLowerCase(), g = $("gameFilter").value;
  const list = items.filter(i => (!g || i.game === g) && (i.name + " " + (i.game || "")).toLowerCase().includes(q));
  $("grid").innerHTML = list.map(i => `
    <div class="card">
      <div class="img">${i.image ? `<img src="${esc(i.image)}" alt="" loading="lazy">` : "🎮"}</div>
      <div class="body">
        <div class="game">${esc(i.game)}</div>
        <div class="name">${esc(i.name)}</div>
        <div class="desc">${esc(i.description)}</div>
        <div class="price">${money(i.price)}</div>
        <button ${i.soldOut ? "disabled" : ""} onclick="add('${esc(i.id)}')">${i.soldOut ? "Sold out" : "Add to cart"}</button>
      </div>
    </div>`).join("") || '<p class="empty">No items found.</p>';
}
function add(id) { cart[id] = (cart[id] || 0) + 1; save(); drawCart(); $("drawer").classList.add("open"); }
function chg(id, d) { cart[id] = (cart[id] || 0) + d; if (cart[id] <= 0) delete cart[id]; save(); drawCart(); }
function lines() { return Object.entries(cart).map(([id, n]) => ({ item: items.find(i => i.id === id), n })).filter(l => l.item); }
function total() { return lines().reduce((s, l) => s + l.item.price * l.n, 0); }
function drawCart() {
  const L = lines(), count = L.reduce((s, l) => s + l.n, 0);
  $("cartBtn").textContent = `Cart (${count})`;
  $("lines").innerHTML = L.map(({ item, n }) => `
    <div class="line"><div><div>${esc(item.name)}</div><small style="color:var(--mute)">${esc(item.game)} · ${money(item.price)}</small></div>
    <div class="qty"><button class="ghost" onclick="chg('${esc(item.id)}',-1)">−</button>${n}<button class="ghost" onclick="chg('${esc(item.id)}',1)">+</button></div></div>`).join("") || '<div class="empty">Your cart is empty.</div>';
  $("total").textContent = money(total());
  $("waBtn").disabled = $("payBtn").disabled = !L.length;
}
function summary() {
  const gid = $("gameId").value.trim();
  let t = `Hi, I'd like to order from ${cfg.storeName}:\n\n`;
  lines().forEach(({ item, n }, i) => t += `${i + 1}. ${item.name} (${item.game}) x${n} - ${money(item.price * n)}\n`);
  t += `\nTotal: ${money(total())}`;
  if (gid) t += `\nGame ID: ${gid}`;
  return t;
}
$("waBtn").onclick = () => window.open(`https://wa.me/${cfg.whatsappNumber}?text=${encodeURIComponent(summary())}`, "_blank");
$("payBtn").onclick = () => window.open(cfg.payment.url.replace("{amount}", total().toFixed(2)), "_blank");
$("cartBtn").onclick = () => $("drawer").classList.add("open");
$("close").onclick = () => $("drawer").classList.remove("open");
$("q").oninput = $("gameFilter").onchange = render;
</script>
</body>
</html>
