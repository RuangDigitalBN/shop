<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Items Shop</title>
<style>
:root{--bg:#121214;--card:#25272d;--line:#3a321c;--text:#ffffff;--mute:#a89f88;--accent:#f4b833;--onaccent:#1a1300;--green:#25d366;--dd:#f4b833;--ddtext:#1a1300;--err:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
h1{margin:0;font-size:1.15rem;color:var(--accent)}
header p{margin:2px 0 0;color:var(--mute);font-size:.8rem}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;color:var(--onaccent);background:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.wa{background:var(--green);color:#052b12;font-weight:600}
.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
main{max-width:1000px;margin:0 auto;padding:16px}
input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font:inherit;margin-bottom:10px}
#tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
#tabs button{background:var(--card);color:var(--text);border:1px solid var(--line);white-space:nowrap;border-radius:99px;font-size:var(--tabfs,16px);padding:.5em .9em}
#tabs button img{height:1.25em!important;width:1.25em!important}
#subtabs{display:none;gap:6px;overflow-x:auto;padding-bottom:10px}
#subtabs button{background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:99px;white-space:nowrap;font-size:calc(var(--tabfs,16px)*.85);padding:.35em .8em}
#subtabs button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
h3{font-size:.9rem;margin:16px 0 8px;color:var(--mute);font-weight:600}
#tabs button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
h2{font-size:1rem;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,170px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:var(--ratio,16/10);background:linear-gradient(135deg,#3a2f12,#1b150a);display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.img img{width:100%;height:100%;object-fit:cover}
.body{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.name{font-weight:600;font-size:.95rem}
.desc{color:var(--mute);font-size:.8rem;flex:1}
.price{font-weight:700;color:var(--accent)}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;z-index:10}
#drawer.open{transform:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
#lines{flex:1;overflow:auto;padding:8px 16px}
.line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.qty{display:flex;align-items:center;gap:6px}
.qty button{padding:2px 9px}
#foot{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#foot input,#foot select{margin:0;width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font:inherit}
#foot{max-height:75%;overflow:auto}
#after{font-size:.85rem;line-height:1.6}
#after button{margin-top:8px;width:100%}
#after .cp{width:auto;margin:0 0 0 8px;padding:3px 10px;font-size:.8rem}
#foot select{background:var(--dd);color:var(--ddtext);border-color:var(--dd);font-weight:600}
#foot select option{background:var(--dd);color:var(--ddtext)}
.total{display:flex;justify-content:space-between;font-weight:700}
.empty{color:var(--mute);text-align:center;padding:36px 0}
.err{color:var(--err)}
#foot input.bad{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
</style>
<script>
/* Apply the colors saved from the last visit right away, so there is no flash of old colors */
try {
  var c = JSON.parse(localStorage.getItem("colors") || "{}");
  var m = { bg: "--bg", card: "--card", line: "--line", text: "--text", mute: "--mute", accent: "--accent", accentText: "--onaccent", green: "--green", dropdown: "--dd", dropdownText: "--ddtext", error: "--err" };
  for (var k in c) if (c[k] && m[k]) document.documentElement.style.setProperty(m[k], c[k]);
  var l = JSON.parse(localStorage.getItem("layout") || "{}");
  if (l.cw) document.documentElement.style.setProperty("--cw", l.cw + "px");
  if (l.ratio) document.documentElement.style.setProperty("--ratio", l.ratio);
  if (l.tfs) document.documentElement.style.setProperty("--tabfs", l.tfs + "px");
} catch (e) {}
</script>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px"><img id="logo" alt="" style="display:none;height:40px;border-radius:6px"><div><h1 id="store">Shop</h1><p id="tag"></p></div></div>
  <button id="cartBtn">Cart (0)</button>
</header>
<img id="banner" alt="" style="display:none;width:100%;max-height:220px;object-fit:cover">
<main>
  <input id="q" placeholder="Search items...">
  <div id="tabs"></div>
  <div id="subtabs"></div>
  <div id="list"></div>
</main>
<aside id="drawer">
  <div class="top"><strong>Your cart</strong><button class="ghost" id="close">Close</button></div>
  <div id="lines"></div>
  <div id="foot">
    <div id="fields"></div>
    <input id="cName" placeholder="Your name">
    <input id="cContact" placeholder="Your WhatsApp number *">
    <select id="method"></select>
    <div id="mNote" style="font-size:.8rem;color:var(--mute)"></div>
    <div class="total" id="totalRow"><span>Total</span><span id="total"></span></div>
    <button class="wa" id="orderBtn">Place order</button>
    <div id="after"></div>
  </div>
</aside>
<script>
let cfg = {}, items = [], games = [], active = "", sub = "", cart = {};
try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch (e) {}
const $ = id => document.getElementById(id);
const money = n => cfg.currency + Number(n).toFixed(2);
const save = () => { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch (e) {} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Wording shown to customers after they place an order. Any of these can be changed in config.json under "texts".
const TX = {
  orderReceived: "Order {order} received.",
  bankIntro: "Please transfer {amount} to:",
  bankLabel: "Bank",
  accountNameLabel: "Account name",
  accountNumberLabel: "Account no",
  copy: "Copy",
  copied: "Copied!",
  proofButton: "Send proof on WhatsApp",
  proofMessage: "Hi, I have paid for order {order}. Sending my proof of payment.",
  onlineMessage: "Complete your payment in the new tab. We start your order once payment is confirmed.",
  whatsappMessage: "WhatsApp has opened so you can send your order.",
  orderIntro: "Hi, I'd like to order from {store}:",
  proofOrderIntro: "Order details:"
};
const raw = k => String((cfg.texts && cfg.texts[k]) || TX[k]);
const tx = (k, v) => esc(raw(k)).replace(/\{(\w+)\}/g, (m, n) => (v && n in v) ? v[n] : m);

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}

fetch("config.json?" + Date.now()).then(r => r.json()).then(c => {
  cfg = c;
  const u = cfg.sheetUrl
    ? cfg.sheetUrl + (cfg.sheetUrl.includes("?") ? "&" : "?") + "t=" + Date.now()
    : "products.csv?" + Date.now();
  return fetch(u).then(r => r.text());
}).then(csv => {
  $("store").textContent = cfg.storeName; document.title = cfg.storeName;
  $("tag").textContent = cfg.tagline || "";
  const rs = document.documentElement.style;
  const cmap = { bg: "--bg", card: "--card", line: "--line", text: "--text", mute: "--mute", accent: "--accent", accentText: "--onaccent", green: "--green", dropdown: "--dd", dropdownText: "--ddtext", error: "--err" };
  Object.entries(cfg.colors || {}).forEach(([k, v]) => { if (v && cmap[k]) rs.setProperty(cmap[k], v); });
  try { localStorage.setItem("colors", JSON.stringify(cfg.colors || {})); } catch (e) {}
  const lay = cfg.layout || {}, cw = Number(lay.cardWidth), ratio = String(lay.imageRatio || "").trim(), tf = Number(lay.tabFontSize);
  const okLay = { cw: cw >= 110 && cw <= 400 ? cw : 0, ratio: /^\d+(\.\d+)?\s*\/\s*\d+(\.\d+)?$/.test(ratio) ? ratio : "" };
  okLay.tfs = tf >= 10 && tf <= 22 ? tf : 0;
  if (okLay.tfs) rs.setProperty("--tabfs", okLay.tfs + "px"); else rs.removeProperty("--tabfs");
  if (okLay.cw) rs.setProperty("--cw", okLay.cw + "px"); else rs.removeProperty("--cw");
  if (okLay.ratio) rs.setProperty("--ratio", okLay.ratio); else rs.removeProperty("--ratio");
  try { localStorage.setItem("layout", JSON.stringify(okLay)); } catch (e) {}
  if (cfg.logo) { $("logo").src = cfg.logo; $("logo").style.display = "block"; }
  if (cfg.banner) { $("banner").src = cfg.banner; $("banner").style.display = "block"; }
  const showClosed = () => {
    if (!cfg.closed) return;
    const b = document.createElement("div");
    b.style.cssText = "background:#5a1f1f;color:#ffd9d9;padding:12px 16px;text-align:center";
    b.textContent = cfg.closedMessage || "We are temporarily closed. Please check back soon.";
    document.querySelector("header").after(b);
  };
  methods = [];
  if (cfg.bank && cfg.bank.enabled) methods.push(["bank", "Bank transfer"]);
  if (cfg.payment && cfg.payment.enabled) methods.push(["online", cfg.payment.label || "Pay online"]);
  methods.push(["whatsapp", "Order via WhatsApp (we confirm first)"]);
  const rows = parseCSV(csv).filter(r => r.some(x => x.trim()));
  const head = rows.shift().map(h => h.trim().toLowerCase());
  const col = n => head.indexOf(n);
  items = rows.map(r => {
    const g = (r[col("game")] || "").trim(), n = (r[col("item")] || "").trim();
    return {
      id: g + "|" + n, game: g, name: n,
      price: parseFloat((r[col("price")] || "").replace(/[^0-9.]/g, "")) || 0,
      image: (r[col("image")] || "").trim(),
      description: (r[col("description")] || "").trim(),
      cat: (r[col("category")] || "").trim(),
      soldOut: /^(y|yes|true|1)$/i.test((r[col("soldout")] || "").trim())
    };
  }).filter(i => i.game && i.name);
  const st = items.find(i => i.game.toLowerCase() === "shop status");
  if (st) {
    cfg.closed = /^(closed|close|yes|true)$/i.test(st.name);
    if (st.description) cfg.closedMessage = st.description;
    items = items.filter(i => i !== st);
  }
  showClosed();
  games = [...new Set(items.map(i => i.game))];
  Object.keys(cart).forEach(id => { if (!items.find(i => i.id === id && !i.soldOut)) delete cart[id]; });
  drawTabs(); render(); drawCart();
}).catch(() => { $("list").innerHTML = '<p class="empty">Could not load the shop files.</p>'; });

function drawTabs() {
  $("tabs").innerHTML = ["", ...games].map(g =>
    `<button class="${g === active ? "on" : ""}" data-g="${esc(g)}">${gimg(g, 20)}${g ? esc(g) : "All"}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { active = b.dataset.g; sub = ""; drawTabs(); render(); });
  drawSubs();
}
function drawSubs() {
  const cats = active ? [...new Set(items.filter(i => i.game === active && i.cat).map(i => i.cat))] : [];
  if (!cats.includes(sub)) sub = "";
  $("subtabs").style.display = cats.length ? "flex" : "none";
  $("subtabs").innerHTML = cats.length ? ["", ...cats].map(c => `<button class="${c === sub ? "on" : ""}" data-c="${esc(c)}">${c ? esc(c) : "All"}</button>`).join("") : "";
  $("subtabs").querySelectorAll("button").forEach(b => b.onclick = () => { sub = b.dataset.c; drawSubs(); render(); });
}
function cardHtml(it, idx) {
  return `
      <div class="card">
        <div class="img">${(it.image || (cfg.gameImages || {})[it.game]) ? `<img src="${esc(it.image || cfg.gameImages[it.game])}" alt="" loading="lazy">` : "🎮"}</div>
        <div class="body">
          <div class="name">${esc(it.name)}</div>
          <div class="desc">${esc(it.description)}</div>
          <div class="price">${money(it.price)}</div>
          <button ${it.soldOut || cfg.closed || !it.price ? "disabled" : ""} onclick="add(${idx})">${cfg.closed ? "Closed" : it.soldOut ? "Sold out" : !it.price ? "Unavailable" : "Add to cart"}</button>
        </div>
      </div>`;
}
function render() {
  const q = $("q").value.toLowerCase();
  const html = games.filter(g => !active || g === active).map(g => {
    const list = items.map((it, idx) => ({ it, idx })).filter(({ it }) => it.game === g && it.name.toLowerCase().includes(q) && (!sub || it.cat === sub))
      .sort((a, b) => a.it.price - b.it.price);
    if (!list.length) return "";
    const cats = [...new Set(items.filter(i => i.game === g && i.cat).map(i => i.cat))];
    const groups = cats.length
      ? [...cats.map(c => [c, list.filter(x => x.it.cat === c)]), ["Other", list.filter(x => !x.it.cat)]]
      : [["", list]];
    return `<h2>${gimg(g, 28)}${esc(g)}</h2>` + groups.filter(gr => gr[1].length).map(([c, arr]) =>
      (c ? `<h3>${esc(c)}</h3>` : "") + `<div class="grid">` + arr.map(x => cardHtml(x.it, x.idx)).join("") + "</div>").join("");
  }).join("");
  $("list").innerHTML = html || '<p class="empty">No items found.</p>';
}
function add(idx) { $("after").innerHTML = ""; toggleForm(false); const id = items[idx].id; cart[id] = (cart[id] || 0) + 1; save(); drawCart(); $("drawer").classList.add("open"); }
function chg(idx, d) { const id = items[idx].id; cart[id] = (cart[id] || 0) + d; if (cart[id] <= 0) delete cart[id]; save(); drawCart(); }
function lines() { return items.map((item, idx) => ({ item, idx, n: cart[item.id] || 0 })).filter(l => l.n); }
function total() { return lines().reduce((s, l) => s + l.item.price * l.n, 0); }
function drawCart() {
  const L = lines();
  $("cartBtn").textContent = `Cart (${L.reduce((s, l) => s + l.n, 0)})`;
  $("lines").innerHTML = L.map(({ item, idx, n }) => `
    <div class="line"><div><div>${esc(item.name)}</div><small style="color:var(--mute)">${esc(item.game)} · ${money(item.price)}</small></div>
    <div class="qty"><button class="ghost" onclick="chg(${idx},-1)">−</button>${n}<button class="ghost" onclick="chg(${idx},1)">+</button></div></div>`).join("") || '<div class="empty">Your cart is empty.</div>';
  $("total").textContent = money(total());
  $("orderBtn").disabled = !L.length || !!cfg.closed;
  drawFields(L);
}
function summary(forProof) {
  const gid = details().join("\n");
  let t = raw(forProof ? "proofOrderIntro" : "orderIntro").split("{store}").join(cfg.storeName) + "\n\n";
  lines().forEach(({ item, n }, i) => t += `${i + 1}. ${item.name} (${item.game}) x${n} - ${money(item.price * n)}\n`);
  t += `\nTotal: ${money(total())}`;
  t += `\n\nOrder No: ${orderId}\nName: ${$("cName").value.trim()}\nContact: ${$("cContact").value.trim()}\n${gid}`;
  return t;
}
let info = {}, orderId = "", methods = [];
document.addEventListener("input", e => e.target.classList && e.target.classList.remove("bad"));
const toggleForm = hide => ["cName", "cContact", "method", "mNote", "totalRow", "orderBtn"].forEach(id => { $(id).style.display = hide ? "none" : ""; });
document.addEventListener("click", e => {
  const t = e.target.closest(".cp");
  if (!t) return;
  const v = t.dataset.copy;
  const done = () => { t.textContent = raw("copied"); setTimeout(() => { t.textContent = raw("copy"); }, 1500); };
  const fb = () => {
    const a = document.createElement("textarea");
    a.value = v; document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); done(); } catch (x) {}
    a.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(v).then(done).catch(fb);
  else fb();
});
const gimg = (g, px) => (cfg.gameImages && cfg.gameImages[g]) ? `<img src="${esc(cfg.gameImages[g])}" alt="" style="height:${px}px;width:${px}px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px">` : "";
const fieldsFor = g => (cfg.gameFields && cfg.gameFields[g]) || ["Game ID / Username"];
function details() {
  const gs = [...new Set(lines().map(l => l.item.game))];
  return gs.flatMap(g => fieldsFor(g).map(f => `${g} - ${f}: ${(info[g + "|" + f] || "").trim()}`));
}
function drawFields(L) {
  const gs = [...new Set(L.map(l => l.item.game))];
  $("fields").innerHTML = gs.map(g => fieldsFor(g).map(f =>
    `<input data-k="${esc(g + "|" + f)}" placeholder="${esc(g)}: ${esc(f)} *" value="${esc(info[g + "|" + f] || "")}">`).join("")).join("");
  $("fields").querySelectorAll("input").forEach(i => i.oninput = () => { info[i.dataset.k] = i.value; });
  const rules = cfg.gameMethods || {};
  const ok = methods.filter(([k]) => gs.every(g => !rules[g] || rules[g].includes(k)));
  const cur = $("method").value;
  $("method").innerHTML = ok.map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join("");
  if (ok.some(([k]) => k === cur)) $("method").value = cur;
  $("mNote").textContent = ok.length < methods.length ? "Some payment options are not available for the items in your cart because we need to check your account first." : "";
}
$("orderBtn").onclick = () => {
  const L = lines(), contact = $("cContact").value.trim();
  if (!L.length) return;
  document.querySelectorAll("#foot .bad").forEach(i => i.classList.remove("bad"));
  const badInputs = [...$("fields").querySelectorAll("input")].filter(i => !i.value.trim());
  if (!contact) badInputs.push($("cContact"));
  if (badInputs.length) {
    badInputs.forEach(i => i.classList.add("bad"));
    $("after").innerHTML = '<b class="err">Please fill in all fields marked *.</b>'; return;
  }
  if (!/^\d{7,15}$/.test(contact.replace(/[\s+\-()]/g, ""))) {
    $("cContact").classList.add("bad");
    $("after").innerHTML = '<b class="err">Please enter a valid WhatsApp number with country code, e.g. 6738123456.</b>'; return;
  }
  const method = $("method").value;
  orderId = "GS" + Date.now().toString(36).toUpperCase().slice(-6);
  const order = { orderId, time: new Date().toLocaleString(), name: $("cName").value.trim(), contact,
    items: L.map(l => `${l.item.game} - ${l.item.name} x${l.n}`).join("; "), total: total().toFixed(2),
    method, details: details().join("; "), status: "Pending" };
  const text = summary(), proofText = summary(true);
  if (cfg.orderUrl && cfg.orderUrl.startsWith("https://"))
    fetch(cfg.orderUrl, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain" }, body: JSON.stringify(order) }).catch(() => {});
  const wa = t => `https://wa.me/${cfg.whatsappNumber}?text=${encodeURIComponent(t)}`;
  if (method === "online") window.open(cfg.payment.url.replace("{amount}", order.total), "_blank");
  if (method === "whatsapp") window.open(wa(text), "_blank");
  const rows = [
    ["Items", L.map(l => `${esc(l.item.game)} - ${esc(l.item.name)} x${l.n}`).join("<br>")],
    ["Total", money(order.total)],
    ["Payment", esc($("method").selectedOptions[0].textContent)],
    ["Name", esc(order.name || "-")],
    ["WhatsApp", esc(order.contact)],
    ...details().map(d => { const i = d.indexOf(": "); return [esc(d.slice(0, i)), esc(d.slice(i + 2))]; })
  ];
  let h = `<b>${tx("orderReceived", { order: esc(orderId) })}</b><div style="margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--mute)">` +
    rows.map(r => `${r[0]}: <span style="color:var(--text)">${r[1]}</span>`).join("<br>") + "</div>";
  if (method === "bank") {
    const b = cfg.bank;
    h += `${tx("bankIntro", { amount: "<b>" + esc(money(order.total)) + "</b>" })}<br>${tx("bankLabel")}: <b>${esc(b.bankName)}</b><br>${b.accountName && b.accountName.trim() && b.accountName.trim() !== "-" ? `${tx("accountNameLabel")}: <b>${esc(b.accountName)}</b><br>` : ""}${tx("accountNumberLabel")}: <b>${esc(b.accountNumber)}</b> <button type="button" class="cp" data-copy="${esc(b.accountNumber)}">${tx("copy")}</button><br>${esc(b.referenceLabel || "Order number")}: <b>${orderId}</b> <button type="button" class="cp" data-copy="${orderId}">${tx("copy")}</button><br>${esc(b.note || "")}<br><button class="wa" onclick="window.open('${wa(raw("proofMessage").split("{order}").join(orderId) + "\n\n" + proofText).replace(/'/g, "%27")}')">${tx("proofButton")}</button>`;
  } else if (method === "online") h += tx("onlineMessage");
  else h += tx("whatsappMessage");
  $("after").innerHTML = h;
  toggleForm(true);
  cart = {}; save(); drawCart();
};

$("cartBtn").onclick = () => $("drawer").classList.add("open");
$("close").onclick = () => $("drawer").classList.remove("open");
$("q").oninput = render;
</script>
</body>
